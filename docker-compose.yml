services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyweave}
      POSTGRES_USER: ${POSTGRES_USER:-storyweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyweave_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - storyweave-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storyweave} -d ${POSTGRES_DB:-storyweave}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storyweave-postgres: